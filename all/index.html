:root{--ink:#2a2018;--paper:#fbf7ef;--bg:#f1e8d8;--mint:#8fd6c0;--yellow:#f2b632;--mute:#8a7a6a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;overflow:hidden}
body{background-image:radial-gradient(#d9ccb6 1px,transparent 1px);background-size:18px 18px}
.app{height:100dvh;display:grid;grid-template-columns:300px minmax(0,1fr);gap:8px;padding:16px 0 0 16px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.brand{font-family:KL;font-size:22px;display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--mint);border:2.5px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.list{position:relative;display:flex;flex-direction:column;gap:10px;overflow:auto;padding:2px 4px 8px 2px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.ep{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:10px 12px;transition:transform .15s,background .15s}
.ep:hover{transform:translateY(-2px)}
.ep:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.ep.on{background:#fff3cf}
.ep i{font-style:normal}
.ep .n{flex:none;width:44px;height:44px;border-radius:14px;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:KL;font-size:20px;background:var(--c)}
.ep .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ep b{font-family:KL;font-weight:400;font-size:17px}
.ep span{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{position:relative;min-height:0;min-width:0;margin-top:-16px}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:0;padding:10px 0 0}
  .side{padding:0 10px}
  .side{gap:8px}
  .brand{font-size:18px;padding-left:4px}
  .list{flex-direction:row;overflow-x:auto;padding:2px 2px 6px}
  .ep{flex:none;padding:6px 12px 6px 6px;gap:8px;border-radius:16px;box-shadow:0 3px 0 var(--ink)}
  .ep .n{width:34px;height:34px;border-radius:11px;font-size:16px}
  .ep b{font-size:15px}.ep span{display:none}
  .view{margin-top:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="brand"><i></i>日常生活原理</div>
    <nav class="list" id="list"></nav>
  </div>
  <main class="view"><iframe id="f" title="原理演示" allow="autoplay"></iframe></main>
</div>
<script>
// 新一期：在最前面加一行 [期号, 关键词, 问题, 颜色]
const EPS = [
  ['05', '缝纫机锁线', '针不穿过布，线怎么在底下打结？', '#f3a6b5'],
  ['04', '水龙头阀芯', '一根把手，怎么管冷热又管大小？', '#9fd0f5'],
  ['03', '闭门器', '门为什么不会“砰”地摔上？', '#8fd6c0'],
  ['02', '圆珠笔转子', '圆珠笔怎么记住“出”还是“缩”？', '#f2b632'],
  ['01', '马桶浮球阀', '马桶为什么会自己停水？', '#c08ad0'],
];
const list = document.getElementById('list'), f = document.getElementById('f');
const btns = EPS.map(([n, k, q, c]) => { const b = document.createElement('button'); b.className = 'ep'; b.style.setProperty('--c', c);
  b.innerHTML = `<i class="n">${n}</i><i class="t"><b>${k}</b><span>${q}</span></i>`; b.onclick = () => go(n, true); list.appendChild(b); return b; });
function go(n, push){ const i = Math.max(0, EPS.findIndex(e => e[0] === n)); const id = EPS[i][0];
  btns.forEach((b, j) => b.classList.toggle('on', j === i)); const b = btns[i]; if (list.scrollWidth > list.clientWidth) list.scrollTo({ left: b.offsetLeft - (list.clientWidth - b.offsetWidth) / 2, behavior: push ? 'smooth' : 'auto' });
  const src = `../${id}/index.html`; if (f.getAttribute('src') !== src) f.setAttribute('src', src);
  document.title = `第 ${id} 期 · ${EPS[i][1]} · 日常生活原理`;
  if (push) history.replaceState(null, '', '#' + id); }
go(location.hash.slice(1) || EPS[0][0]);
addEventListener('hashchange', () => go(location.hash.slice(1)));
</script>
</body>
</html>
