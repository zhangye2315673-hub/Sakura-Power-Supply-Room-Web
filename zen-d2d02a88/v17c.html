//   - 静/动两个休止角（迟滞）、滑面崩成沙舌：thomasma「Sand-racer」https://discourse.threejs.org/t/sand-racer-real-time-sand-simulation-terramechanics-in-webgpu-three-js-r187-tsl/96255
//   - 球压沙：按球底形状挖、挖出的体积推到外圈、再做休止角松弛（体积守恒）：vector76/sandsim https://github.com/vector76/sandsim/blob/main/docs/sand-model.md
//   - 大块沙不动、超过休止角才滑：av/safe-sand https://github.com/av/safe-sand

//   - 无墙盘边 = 致命边缘（Patience Mode）：Rikzu Games《Patience Balls》https://rikzugames.itch.io/patience-balls

//  - 局部纹理更新用 three.js Texture.addUpdateRange（r187 内置）

sun.position.set(-6.2, 3.3, -3.2);

// ---------- 小工具 ----------
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

  const p = new Uint8Array(512), r = rng(seed); for (let i = 0; i < 256; i++) p[i] = i;

  const f = t => t * t * (3 - 2 * t);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const a = g[p[X + p[Y]]], b = g[p[X + 1 + p[Y]]], c = g[p[X + p[Y + 1]]], d = g[p[X + 1 + p[Y + 1]]];
    const u = f(xf), v = f(yf); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;

const n3 = (x, y, z) => (n1(x + z * 0.71, y + z * 1.37) + n2(y - z * 0.53, x + z * 0.91)) * 0.5;

// ---------- 迷宫数据（5×5 格，格宽 1，盘面 -2.5..2.5） ----------
const W = 5, HALF = W / 2, WALL_T = 0.22, WALL_H = 0.42, BALL_R = 0.27;
// 内墙：x0,x1,z0,z1
const walls = [
  [-2.5, 0.6, -0.61, -0.39],
  [0.89, 1.11, -0.5, 1.6],
  [-1.6, -0.1, 1.39, 1.61],
];
const rim = [ // 外框，内边缘贴盘面
  [-2.8, 2.8, -2.8, -2.5], [-2.8, 2.8, 2.5, 2.8], [-2.8, -2.5, -2.5, 2.5], [2.5, 2.8, -2.5, 2.5]
];
const colliders = walls.slice();   // v12：没有外框，盘边不挡

// [v6-A 写实] 米白偏暖的细砂，平行耙出的圆脊尖沟，颗粒细碎；滚痕是压下去的碗形槽、两侧拱起
const SAND_BASE = [238, 233, 222], SAND_MOTTLE = 0.05;
const TR_R = BALL_R * 0.66, TR_DEPTH_V = 0.05, TR_BERM_V = 0.016;
// ---------- 白砂（v6）：耙纹不再烘焙成 2048² 明暗贴图，改在 shader 里按盘面坐标算“高度 + 法线” ----------
// v5 的问题：耙纹只是 bumpMap 上的平滑正弦明暗，近看糊、像印上去的；滚痕是一道平涂。
// v6：底色/墙脚苔藓仍烘焙一张 1024² 贴图（只传一次）；沟垄高度、颗粒、滚痕全部在 shader 里算，法线由高度梯度重建。
//  - 颗粒：随机向量扰动法线（Journey 沙子，Alan Zucconi 教程 https://www.alanzucconi.com/2019/10/08/journey-sand-shader-3/）
//  - 耙纹 = 距离场的等值线（joezgao/karesansui https://github.com/joezgao/karesansui；Emergent Mind Zen Garden）
//  - 滚痕 = 凹槽 + 两侧隆起，max 叠加不越压越深，法线由高度差重建（Hugo Leblanc https://hugoleblanc.fr/devlog/unity-snow-trails/）
const S = 1024, PX = S / W;
const sandCol = document.createElement('canvas'); sandCol.width = sandCol.height = S;
function sdBox(x, z, b) {
  const cx = (b[0] + b[1]) / 2, cz = (b[2] + b[3]) / 2, hx = (b[1] - b[0]) / 2, hz = (b[3] - b[2]) / 2;
  const dx = Math.abs(x - cx) - hx, dz = Math.abs(z - cz) - hz;
  return Math.hypot(Math.max(dx, 0), Math.max(dz, 0)) + Math.min(Math.max(dx, dz), 0);
}
(function genSand() {
  const cx = sandCol.getContext('2d'), ci = cx.createImageData(S, S);
  const moss = [0x6F, 0x7F, 0x4E], mossY = [0x8C, 0x94, 0x55], base = SAND_BASE;
  for (let py = 0; py < S; py++) for (let px = 0; px < S; px++) {
    const x = (px + 0.5) / PX - HALF, z = (py + 0.5) / PX - HALF;
    let d = 9; for (const b of walls)   /* v12：盘边不再压暗（没有墙脚） */ d = Math.min(d, sdBox(x, z, b));
    const tone = 1 + (n1(x * 1.1, z * 1.1) - 0.5) * SAND_MOTTLE + (n2(x * 9, z * 9) - 0.5) * 0.02 - (1 - THREE.MathUtils.smoothstep(d, 0, 0.09)) * 0.06;
    let r = base[0] * tone, g = base[1] * tone, bl = base[2] * tone;
    const mn = n1(x * 7 + 3, z * 7) * 0.65 + n2(x * 19, z * 19) * 0.35;           // 墙脚苔藓蔓到砂上（同 v5）
    const mossAmt = 0 * THREE.MathUtils.smoothstep(mn - d * 7.5, 0.42, 0.52);   // [v10] 墙脚蔓到砂上的碎苔去掉（属于“墙”的写实细节，和圆润软苔帽冲突）
    if (mossAmt > 0) {
      const t = n2(x * 23, z * 23), mc = [0, 1, 2].map(k => moss[k] + (mossY[k] - moss[k]) * t);
      r += (mc[0] - r) * mossAmt; g += (mc[1] - g) * mossAmt; bl += (mc[2] - bl) * mossAmt;
    }
    const i = (py * S + px) * 4;
    ci.data[i] = Math.min(255, r); ci.data[i + 1] = Math.min(255, g); ci.data[i + 2] = Math.min(255, bl); ci.data[i + 3] = 255;
  }
  cx.putImageData(ci, 0, 0);
})();
const sandMap = new THREE.CanvasTexture(sandCol); sandMap.colorSpace = THREE.SRGBColorSpace; sandMap.anisotropy = 8;
// 轨迹：沿用 v5 的 512² 小贴图 + 逐行局部上传；通道改为 R=凹槽深度（球面压痕剖面，取 max） G=槽边隆起（取 max）
const TR_N = 512, TPX = TR_N / W;
const trailData = new Uint8Array(TR_N * TR_N * 4);
const trailTex = new THREE.DataTexture(trailData, TR_N, TR_N, THREE.RGBAFormat);
trailTex.magFilter = trailTex.minFilter = THREE.LinearFilter; trailTex.generateMipmaps = false; trailTex.needsUpdate = true;
const v4 = b => b.map(v => v.toFixed(3)).join(', ');
const GLSL_SAND = `
uniform sampler2D trailMap;
varying float vRip; varying float vH; varying float vFlow; varying vec2 vP; varying vec3 vBX; varying vec3 vBY; varying vec3 vBZ;
vec2 gGrad = vec2(0.0); float gH01 = 1.0; float gGrainK = 1.0; float gGlit = 0.0; float gInk = 0.0; vec4 gT0 = vec4(0.0);
vec3 gDirL = vec3(0.0, 1.0, 0.0); vec3 gDirC = vec3(0.0);
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), f.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), f.x), f.y); }
float sdB(vec2 p, vec4 b){ vec2 c = vec2(b.x + b.y, b.z + b.w) * 0.5, h = vec2(b.y - b.x, b.w - b.z) * 0.5; vec2 d = abs(p - c) - h;
  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }
float sdIn(vec2 p){ return min(min(sdB(p, vec4(${v4(walls[0])})), sdB(p, vec4(${v4(walls[1])}))), sdB(p, vec4(${v4(walls[2])}))); }
float sdAll(vec2 p){ return min(sdIn(p), ${HALF.toFixed(2)} - max(abs(p.x), abs(p.y))); }
vec2 trUv(vec2 p){ return vec2(p.x + ${HALF.toFixed(2)}, ${HALF.toFixed(2)} - p.y) / ${W.toFixed(1)}; }
const float TRE = ${(W / TR_N).toFixed(5)};
float trH(vec4 t){ return -t.r * TR_DEPTH + t.g * (1.0 - smoothstep(0.05, 0.45, t.r)) * TR_BERM; }
// 滚痕：中心 + 两个前向差分，返回梯度；gT0 存中心值
vec2 trailGrad(vec2 p){

`;
function sandVertex(sh) {

    .replace('#include <fog_vertex>', `#include <fog_vertex>
vP = position.xz; vRip = aRip; vH = aH; vFlow = aFlow;
vBX = normalize(normalMatrix * vec3(1.0, 0.0, 0.0)); vBZ = normalize(normalMatrix * vec3(0.0, 0.0, 1.0)); vBY = normalize(normalMatrix * normal);`);
}
// 抓取太阳（唯一的平行光）在本像素的方向和带阴影的颜色，给闪粒/卡通分层用
const LIGHTS_CAPTURE = THREE.ShaderChunk.lights_fragment_begin.replace('RE_Direct( directLight, geometryPosition', 'gDirL = directLight.direction; gDirC = directLight.color;\n\t\tRE_Direct( directLight, geometryPosition');
let trStamp = 0;   // [v10 bug 修] 刻痕序号（存在贴图 B/A 通道，着色器不读这两个通道）
function paintTrail(x, z) {
  trStamp = (trStamp + 1) & 65535;
  const cx = (x + HALF) * TPX, cy = (HALF - z) * TPX; // DataTexture 第 0 行在 v=0（世界 z=+2.5）
  const r = TR_R * TPX, ro = r * 1.6;
  const x0 = Math.max(0, Math.floor(cx - ro)), x1 = Math.min(TR_N - 1, Math.ceil(cx + ro));
  const y0 = Math.max(0, Math.floor(cy - ro)), y1 = Math.min(TR_N - 1, Math.ceil(cy + ro));
  for (let py = y0; py <= y1; py++) {
    for (let px = x0; px <= x1; px++) {
      const d = Math.hypot(px + 0.5 - cx, py + 0.5 - cy) / r;
      if (d >= 1.6) continue;
      const g = d < 1 ? Math.min(1, THREE.MathUtils.smoothstep(1 - d, 0, 0.45) * 0.72 + 0.28 * (1 - d * d)) : 0; // 球压下去的碗形槽，槽壁陡、槽底缓
      const b = d > 0.78 ? Math.exp(-(((d - 1.13) / 0.2) ** 2)) : 0;                                       // 被挤到两侧的砂埂
      const i = (py * TR_N + px) * 4;
      // [v10 bug 修] v9 是纯 max 叠加：同一处第二次经过数值不变 → 没有新痕。现在：新槽照样取 max 刻深，并压平槽里的旧砂埂；
      // 新砂埂会把旧槽填回一部分（砂被推进旧沟）。思路参考 snowflow 的“砂埂滑进凹陷”https://github.com/Am11n/snowflow
      // 只填“旧”槽：B/A 通道存 16 位刻痕序号，刚刻过（14 个印以内，≈0.35 格）的槽不填，否则会把球身后刚刻的槽来回填平、出锯齿
      let R0 = Math.max(trailData[i], g * 255), B0 = Math.max(trailData[i + 1], b * 255);

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ===================== v11：界面（只用文案清单里的字）+ 手机重力控制 + 竖屏适配 =====================
// 可见文字只有：静 / 开始 / 第 1/3 关 / 计时 00:00 / 落叶 0/3 / 重来 / 通关（枫叶是 SVG 图标，不是字）
// ?shot=1：截图/测帧模式，不显示开始页和界面
const SHOT = true;   // v12：界面先全部去掉（用户 2026-11-17：UI 太垃圾，先去掉），一打开就能玩
const game = { started: false, t: 0, leaves: 0, won: false, lock: 0, onReset: [], onStart: [] };

// ---------- 界面 ----------

  .chip svg{width:15px;height:15px}

const $ = id => document.getElementById(id);
const fmtT = t => { const s = Math.floor(t); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
let hudLast = { t: '', l: -1 };
function hudTick() {

    $('cLn').textContent = `落叶 ${game.leaves}/3`; hudLast.l = game.leaves;
  }
}
function showWin() {
  $('wT').textContent = '计时 ' + fmtT(game.t);
  [...$('wL').children].forEach((e, i) => e.classList.toggle('off', i >= game.leaves));

// ---------- 手机重力控制（DeviceOrientation） ----------
// 映射：开始时的手机姿态 = 零点（校准）；相对零点的倾斜（度）→ 盘面倾斜，±12° 封顶；
// 一阶低通（约 60ms）+ 圆形死区 1.5°；按 screen.orientation.angle 旋转映射，竖屏/横屏/倒拿都对。

const GYRO = { DZ: 1.5, GAIN: 1.0, MAX: 12, TAU: 0.06 };
const gyro = { on: false, got: false, ref: null, raw: [0, 0], f: [0, 0], ang: 0, n: 0 };

function gyroTilt(dt) {

// ---------- 每帧输入钩子（在 update 里、倾斜平滑之前调用） ----------
function inputHook(dt) {
  if (window.__drv) return;                                     // 旧测试接口 __api.sim 直接给倾角
  if (!game.started && !SHOT) { tiltTarget.x = tiltTarget.z = 0; return; }
  if (gyroTilt(dt)) drag = null;                                // 陀螺仪生效时不再响应拖动
  if (game.lock > 0) { game.lock -= dt; tiltTarget.x = tiltTarget.z = 0; }   // 晕：短暂不受控（只在玩法原型里会被设置）

// ---------- 开始 / 重来 ----------
function resetCommon() {
  Object.assign(st, { x: -1.8, z: -1.5, vx: 0, vz: 0, lastPX: -9, lastPZ: -9, fall: null });
  tilt.x = tilt.z = tiltTarget.x = tiltTarget.z = 0; spin.quaternion.identity(); drag = null;
  leafTaken = false; leafFade = 0; leaf.visible = true; leaf.scale.setScalar(1);
  trailData.fill(0); trailTex.needsUpdate = true;
  sandReset(); grains.length = 0; nSurf = 0;
  game.t = 0; game.won = false; game.lock = 0; game.leaves = 0; hudLast = { t: '', l: -1 };
  game.onReset.forEach(f => f());
  gyroRecenter(); if ($('win')) $('win').hidden = true; hudTick();

$('bStart')?.addEventListener('click', () => {
  enableGyro();                                                   // 同步调用：iOS 权限弹窗
  $('start').hidden = true; $('hud').hidden = false; $('bAgain').hidden = false;
  game.started = true; game.onStart.forEach(f => f()); hudTick();
});
$('bAgain')?.addEventListener('click', () => resetCommon());
if (SHOT) game.started = true;

// ---------- 竖屏适配（按 design_v10/portrait_layout_v10.png） ----------
// 竖屏：机位抬到约 58°，按“盘宽 6.2 占屏宽 92%”反算垂直 fov（Sebastian Lenton 的 fov 适配思路）；远景树团/石丘隐藏，雾拉远。
// 横屏：保持 v10 机位，只在窄屏（宽高比小于设计稿）时放大 fov 保证盘不被左右裁掉。
const CAM0 = { base: camBase.clone(), look: CAM_LOOK.clone(), fov: camera.fov };
function layout() {
  const asp = innerWidth / innerHeight, portrait = asp < 0.85;
  const far = scene.children.filter(o => (o.isInstancedMesh && !o.userData.keep) || (o.isMesh && o.geometry && o.geometry.type === 'IcosahedronGeometry'));
  if (portrait) {
    const dist = 13.2, el = 58 * D2R, halfW = 3.1 / 0.92;
    camera.fov = 2 * Math.atan(Math.tan(Math.atan(halfW / dist)) / asp) / D2R;

addEventListener('resize', layout);
window.__gyro = gyro; window.__game = game; window.__step1 = () => update(1 / 60);   // 测试钩子（无可见输出）

function afterUpdate(dt) { if (game.started && !game.won) game.t += dt; game.leaves = leafTaken ? 1 : 0; hudTick(); }
layout();

// 测试钩子（无可见输出）：固定步长推进、切机位

  health: () => { let mx = 0, bad = 0, R = 0, mk = -1; for (let k = 0; k < N2; k++) { const h = sR[k] + sF[k]; if (!isFinite(h)) bad++; else { if (h > mx) { mx = h; mk = k; } R += h; } } return [+mx.toFixed(3), bad, Math.round(R), mk % SGN, Math.floor(mk / SGN), +sBase[mk].toFixed(3)]; },

  simdt(n, dt, tx, tz) { window.__drv = 1; tiltTarget.x = tx; tiltTarget.z = tz; for (let i = 0; i < n; i++) update(dt); window.__drv = 0; },

  view(v) { view = v; },
  renderOnce() { if (trailDirty) { trailTex.needsUpdate = true; trailDirty = false; } placeCamera(); renderer.shadowMap.needsUpdate = true; renderer.render(scene, camera); }, reset() { Object.assign(st, { x: -1.8, z: -1.5, vx: 0, vz: 0 }); tilt.x = tilt.z = tiltTarget.x = tiltTarget.z = 0; spin.quaternion.identity(); update(1 / 60); }, state: () => ({ ...st, tilt: { ...tilt }, leafTaken })
