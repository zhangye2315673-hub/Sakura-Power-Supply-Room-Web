<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>怪兽甜点铺 · Monster Sweets</title>
  <script type="module" crossorigin src="./assets/index-6wfV-ZQy.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CHT4yVoy.css">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="wash"></canvas>

<div id="stage">
  <!-- ======== SHOP PAGE ======== -->
  <div id="page" class="hide">
    <header class="brand">
      <div class="logo">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#d24a40"/><circle cx="32" cy="32" r="26" fill="none" stroke="#f8efe2" stroke-width="1.5" stroke-dasharray="2 3"/>
          <path d="M18 44 L46 44 L42 26 Q32 20 22 26 Z" fill="#f6d27a"/><path d="M22 26 Q32 19 42 26 L43 30 Q32 25 21 30 Z" fill="#a5552d"/>
          <circle cx="33" cy="17" r="4.2" fill="#f8efe2"/><circle cx="27.5" cy="35" r="1.6" fill="#3a2a22"/><circle cx="36.5" cy="35" r="1.6" fill="#3a2a22"/>
          <path d="M30 38.5 Q32 40.5 34 38.5" stroke="#3a2a22" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      </div>
      <div class="names">
        <div class="script">Monster Sweets</div>
        <div class="zh">怪兽甜点铺</div>
      </div>
    </header>

    <div class="chips">
      <div class="chip"><span class="ic">✿</span><span id="day">第 1 天</span></div>
      <div class="chip"><span class="ic coin">¥</span><span id="coins">0</span></div>
      <div class="chip"><span class="ic heart">♥</span><span id="hearts">0</span></div>
    </div>

    <section class="hero">
      <div class="eyebrow">PUDDING YOKAI PATISSERIE</div>
      <h1>今天的甜点，<br/>由布丁妖怪<br/>亲手送到家。</h1>
      <p>街角那栋红色小楼，每天清晨烤好第一炉。<br/>接单、打包、开着小卡车穿过整座小镇。</p>
    </section>

    <aside class="menu card">
      <div class="tape"></div>
      <div class="menu-head"><span class="script">Menu</span><span class="zh">本日菜单</span></div>
      <div id="menuGrid" class="grid"></div>
      <div class="menu-foot">点一点甜点，转着看看</div>
    </aside>

    <!-- receipt printer -->
    <div id="printer" class="printer">
      <div class="paper-out" id="paperOut"><div class="tear"></div><div class="lines" id="paperLines"></div></div>
      <div class="body">
        <div class="slot"></div>
        <div class="face"><span class="led" id="led"></span><span class="lbl">ORDER</span></div>
      </div>
      <div class="bubble" id="bubble">点我取单！</div>
    </div>
  </div>

  <!-- ======== RECEIPT MODAL ======== -->
  <div id="receiptWrap" class="modal hide">
    <div class="ticket" id="ticket">
      <div class="washi"></div>
      <div class="t-head"><div class="script">Order</div><div class="no" id="tNo">No. 0001</div></div>
      <div class="cust"><img id="tAvatar" alt="" /><div><div class="cname" id="tName"></div><div class="caddr" id="tAddr"></div></div></div>
      <div class="dash"></div>
      <div id="tItems" class="items"></div>
      <div class="dash"></div>
      <div class="total"><span>合计</span><span id="tTotal"></span></div>
      <div class="note" id="tNote"></div>
      <button class="go" id="goBtn"><span>派送</span><small>Deliver</small></button>
      <div class="zig"></div>
    </div>
  </div>

  <!-- ======== PRODUCT VIEWER ======== -->
  <div id="viewer" class="modal hide">
    <div class="vcard">
      <canvas id="vcanvas"></canvas>
      <div class="vinfo">
        <div class="script" id="vEn"></div>
        <div class="vname" id="vName"></div>
        <div class="vdesc" id="vDesc"></div>
        <div class="vprice" id="vPrice"></div>
        <div class="vhint">拖动旋转 · 点击空白处关闭</div>
      </div>
    </div>
  </div>

  <!-- ======== DRIVE HUD ======== -->
  <div id="hud" class="hide">
    <div class="pill">
      <img id="hAvatar" alt="" />
      <div class="ptext"><div class="pt1" id="hTo"></div><div class="pt2" id="hSub"></div></div>
    </div>
    <div class="route"><div class="track"><div class="fill" id="hFill"></div></div><div class="truck" id="hTruck"><svg viewBox="0 0 34 30"><rect x="3" y="12" width="17" height="10" rx="2" fill="#c99a6c" stroke="#4b3226" stroke-width="1.6"/><path d="M19 22 V9 Q19 6 22 6 H26 Q29 6 30 10 L31 15 V22 Z" fill="#d24a40" stroke="#4b3226" stroke-width="1.6"/><rect x="22" y="8.5" width="5" height="5" rx="1" fill="#bfe0e6"/><circle cx="9" cy="23" r="3.6" fill="#3b3534"/><circle cx="25" cy="23" r="3.6" fill="#3b3534"/></svg></div><div class="flag">⌂</div></div>
    <button id="ffBtn" class="ff">加速 ››</button>
  </div>

  <div id="toast" class="toast hide"></div>
  <div id="speech" class="speech hide"></div>
</div>

<!-- ======== LOADER ======== -->
<div id="loader">
  <div class="ld-in">
    <svg class="ld-pud" viewBox="0 0 120 120">
      <ellipse cx="60" cy="104" rx="34" ry="5" fill="#e8d9c2"/>
      <path d="M26 98 L94 98 L84 46 Q60 34 36 46 Z" fill="#f6d27a" stroke="#4b3226" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M36 46 Q60 33 84 46 L86 56 Q78 52 76 60 Q72 52 66 56 Q60 50 54 57 Q48 52 44 60 Q42 52 34 56 Z" fill="#a5552d" stroke="#4b3226" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="62" cy="30" r="8" fill="#d8343b" stroke="#4b3226" stroke-width="2.5"/><path d="M63 22 Q66 14 72 12" stroke="#4b3226" stroke-width="2.5" fill="none"/>
      <circle cx="50" cy="74" r="3.4" fill="#3a2a22"/><circle cx="70" cy="74" r="3.4" fill="#3a2a22"/>
      <ellipse cx="42" cy="81" rx="5" ry="3" fill="#f3968c"/><ellipse cx="78" cy="81" rx="5" ry="3" fill="#f3968c"/>
      <path d="M56 81 Q60 85 64 81" stroke="#3a2a22" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="ld-script">Monster Sweets</div>
    <div class="ld-zh">怪兽甜点铺</div>
    <div class="ld-bar"><div id="ldFill"></div></div>
    <div class="ld-tip" id="ldTip">正在烤第一炉布丁…</div>
  </div>
</div>

</body>
</html>
