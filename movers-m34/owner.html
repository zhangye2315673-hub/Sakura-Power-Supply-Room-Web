<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f8efe2" />
<title>店主 · 怪兽甜品铺</title>
<link rel="icon" type="image/png" href="./assets/favicon-DdmFDUOL.png" />
<style>@font-face{font-family:ZhBody;src:url(./assets/zhbody-BX7BRNSA.woff2)format("woff2");font-display:swap}:root{--paper:#f8efe2;--pp:#fffbf4;--k:#4b3226;--k2:#7d6352;--c:#d24a40;--hair:#4b322629;--hair2:#4b32264d;--sh:0 8px 18px -12px #4b322659}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{background:var(--paper);height:100%;color:var(--k);-webkit-user-select:none;user-select:none;margin:0;font-family:ZhBody,serif;overflow:hidden}#gl{touch-action:none;width:100vw;height:100vh;display:block;position:fixed;inset:0}#labs{pointer-events:none;position:fixed;inset:0}.lab{text-align:center;letter-spacing:.08em;color:var(--k2);opacity:.8;font-size:12px;position:absolute}#bar{left:50%;bottom:max(18px, env(safe-area-inset-bottom));border:1px solid var(--hair);box-shadow:var(--sh);-webkit-backdrop-filter:blur(6px);background:#fffbf4db;border-radius:999px;align-items:center;gap:6px;max-width:calc(100vw - 20px);padding:6px;display:flex;position:fixed;transform:translate(-50%)}#bar button{min-width:46px;height:38px;color:var(--k2);font:inherit;letter-spacing:.04em;white-space:nowrap;cursor:pointer;background:0 0;border:1px solid #0000;border-radius:999px;padding:0 12px;font-size:16px;transition:color .2s,border-color .2s,background .2s}#bar button:hover{color:var(--k)}#bar button.on{color:var(--c);background:#fffdf8;border-color:#d24a4073}#bar .sep{background:var(--hair2);width:1px;height:22px;margin:0 2px}#bar #rot{place-items:center;width:38px;min-width:38px;padding:0;display:grid}#bar #rot svg{width:20px;height:20px}@media (width<=560px){#bar{border-radius:22px;grid-template-columns:repeat(5,1fr);gap:4px;width:calc(100vw - 20px);display:grid}#bar button{min-width:0;height:38px;padding:0 4px;font-size:15px}#bar .sep{display:none}#bar #rot{justify-self:stretch;width:auto}}</style>
  <script type="module" crossorigin src="./assets/owner-CRI0UhRU.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/shadowfx-DkiaENLE.js">
  <link rel="modulepreload" crossorigin href="./assets/anim-DJYCBf7y.js">
</head>
<body>
<canvas id="gl"></canvas>
<div id="labs"></div>
<div id="bar">
  <button data-a="walk">走</button><button data-a="run">跑</button><button data-a="idle" class="on">待机</button><button data-a="wave">挥手</button>
  <button data-a="gift">收礼</button><button data-a="sit">坐吃</button><button data-a="rain">雨天</button><button data-a="goofy">搞怪</button>
  <span class="sep"></span>
  <button id="rot" class="on" aria-label="自动旋转"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.6 4.2v3.6H16"/></svg></button>
</div>
</body>
</html>
