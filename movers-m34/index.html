<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f8efe2" />
<title>怪兽甜品铺 · Monster Sweets</title>
<link rel="icon" type="image/png" href="./assets/favicon-CI7VUeaY.png" />
<link rel="apple-touch-icon" href="./assets/apple-touch-icon-DZrQBdDH.png" />
<link rel="preload" as="image" href="./assets/logo-C2fly4fh.webp" />
  <script type="module" crossorigin src="./assets/index-BYlwYTRo.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-C0mYvnDg.css">
</head>
<body>
<canvas id="gl"></canvas>


<div id="stage">
  <!-- ======== SHOP PAGE ======== -->
  <div id="page" class="hide">
    <header class="brand"><img class="logo" src="./assets/logo-C2fly4fh.webp" alt="怪兽甜品铺" draggable="false" /></header>

    <div class="chips">
      <div class="chip stat"><span class="ic" data-icon="day"></span><span id="day">第1天</span></div>
      <div class="chip stat"><span class="ic" data-icon="coin"></span><span id="coins">0</span></div>
      <div class="chip stat"><span class="ic" data-icon="heart"></span><span id="hearts">0</span></div>
      <div class="chip swap" id="swapShop" title="换一栋"><span class="ic" data-icon="swap"></span></div>
    </div>

    <aside class="menu card">
      <div class="tape"></div>
      <div class="menu-head">
        <span class="script">Menu</span>
        <div class="menu-tabs" id="menuTabs"><button class="mt on" data-cat="dessert">甜品</button><button class="mt" data-cat="drink">饮品</button></div>
      </div>
      <div id="menuGrid" class="grid"></div>
    </aside>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="deckle" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

    <!-- receipt printer: a butter-cream monster till; the paper really comes out of the slot -->
    <div id="printer" class="printer">
      <svg class="pbody" viewBox="0 0 260 210" aria-hidden="true" stroke="#5b3a29" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
        <ellipse cx="130" cy="202" rx="112" ry="7" fill="rgba(75,50,38,.16)" stroke="none"/>
        <rect x="42" y="184" width="30" height="16" rx="6" fill="#8a5a3f"/><rect x="188" y="184" width="30" height="16" rx="6" fill="#8a5a3f"/>
        <path d="M20 100 C2 96 -8 76 -4 56 C5 70 14 77 28 80 Z" fill="#9b6646"/><path d="M240 100 C258 96 268 76 264 56 C255 70 246 77 232 80 Z" fill="#9b6646"/>
        <path d="M2 64 C3 70 6 74 10 77" fill="none" stroke="#fff" stroke-width="2.2" opacity=".5"/>
        <rect x="16" y="34" width="228" height="52" rx="25" fill="#f6d27a"/>
        <path d="M34 44 h40" stroke="#fff" stroke-width="3" opacity=".6"/>
        <rect x="62" y="48" width="136" height="13" rx="6.5" fill="#3a2a22"/>
        <rect x="12" y="72" width="236" height="118" rx="28" fill="#f6d27a"/>
        <rect x="26" y="82" width="208" height="96" rx="20" fill="#fffaf0"/>
        <circle cx="110" cy="100" r="4.6" fill="#3a2a22" stroke="none"/><circle cx="150" cy="100" r="4.6" fill="#3a2a22" stroke="none"/>
        <circle cx="111.6" cy="98.4" r="1.4" fill="#fff" stroke="none"/><circle cx="151.6" cy="98.4" r="1.4" fill="#fff" stroke="none"/>
        <path d="M123 106 q3.5 4.5 7 0 q3.5 4.5 7 0" fill="none" stroke-width="2.4"/>
        <ellipse cx="97" cy="110" rx="7.5" ry="4" fill="#f6b3bb" stroke="none"/><ellipse cx="163" cy="110" rx="7.5" ry="4" fill="#f6b3bb" stroke="none"/>
        <rect x="40" y="124" width="122" height="40" rx="11" fill="#2f4a48"/>
        <path d="M188 152 C178 145 175 140 177.5 135.5 C180 131 186 132 188 136 C190 132 196 131 198.5 135.5 C201 140 198 145 188 152 Z" fill="#ef8f9f" stroke-width="2.2"/>
        <path d="M216 131 l3 6.4 l7 0.8 l-5.2 4.8 l1.5 7 l-6.3 -3.6 l-6.3 3.6 l1.5 -7 l-5.2 -4.8 l7 -0.8 Z" fill="#f6cf62" stroke-width="2.2"/>
        <g transform="translate(188 -8) rotate(14 34 40)"><rect x="18" y="34" width="34" height="14" rx="4" fill="#fffaf0"/><path d="M19 36 C9 34 9 18 20 19 C20 9 34 7 36 15 C42 8 54 13 51 22 C58 26 55 36 51 36 Z" fill="#fffaf0"/><path d="M26 41 h3 M34 41 h3 M42 41 h3" stroke-width="1.8"/></g>
      </svg>
      <div class="strip" id="paperOut"><div class="sp" id="paperLines"></div></div>
      <div class="lip2"></div>
      <div class="lcd" id="led">READY</div>
      <div class="bubble" id="bubble">点我取单！</div>
    </div>
  </div>

  <!-- ======== RECEIPT MODAL ======== -->
  <div id="receiptWrap" class="modal hide">
    <div class="rcol">
      <div class="ticket" id="ticket">
        <img class="r-logo" src="./assets/mascot-CWaur_he.webp" alt="" draggable="false" />
        <div class="r-title">怪兽甜品铺</div>
        <div class="dash"></div>
        <div class="r-meta"><span><b id="tNo">No.0001</b></span><span id="tTime">05:11</span></div>
        <div class="dash"></div>
        <div id="tItems" class="items"></div>
        <div class="dash"></div>
        <div class="r-kv"><span>顾客</span><b id="tName"></b></div>
        <div class="r-kv"><span>送至</span><b id="tAddr"></b></div>
        <div class="r-kv"><span>路程</span><b id="tDist"></b></div>
        <div class="dash"></div>
        <div class="total"><span>合计</span><span id="tTotal"></span></div>
        <div class="r-bonus"><span class="ic" data-icon="heart"></span>+1</div>
        <div class="note" id="tNote"></div>
        <div class="barcode" id="barcode"></div>
      </div>
      <button class="go" id="goBtn"><span class="go-trk"></span><span>派送</span></button>
    </div>
  </div>

  <!-- ======== PRODUCT DETAIL (recipe card) ======== -->
  <div id="viewer" class="modal hide">
    <div class="vcard">
      <div class="vlace"></div>
      <i class="tape tl"></i><i class="tape tr"></i>
      <div class="vstage"><div class="vdoily"></div><canvas id="vcanvas"></canvas><span class="vrot ic" data-icon="rotate"></span></div>
      <div class="vinfo">
        <div class="ribbon"><span id="vName"></span></div>
        <div class="script" id="vEn"></div>
        <div class="vnote"><i class="tape tn"></i><div class="vdesc" id="vDesc"></div></div>
        <div class="vtag"><span id="vPrice"></span></div>
      </div>
      <button class="cookie-x" id="vClose" aria-label="关闭"><span class="ic" data-icon="close"></span></button>
    </div>
  </div>

  <!-- ======== DRIVE HUD ======== -->
  <div id="hud" class="hide">
    <div class="pill">
      <i class="tape"></i>
      <img id="hAvatar" alt="" />
      <div class="ptext"><div class="pt1" id="hTo"></div><div class="pt2" id="hSub"></div></div>
    </div>
    <div class="route" id="hRoute"><div class="track"><div class="fill" id="hFill"></div></div><div class="truck" id="hTruck"><svg class="trk" viewBox="0 0 96 64" aria-hidden="true" stroke="#5b3a29" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"> <g class="trk-body"> <path d="M6 46 V20 a6 6 0 0 1 6 -6 H56 a4 4 0 0 1 4 4 V46 Z" fill="#fdeacb"/> <path d="M6 23 V20 a6 6 0 0 1 6 -6 H56 a4 4 0 0 1 4 4 V23 q-4.5 4.5 -9 0 q-4.5 4.5 -9 0 q-4.5 4.5 -9 0 q-4.5 4.5 -9 0 q-4.5 4.5 -9 0 q-4.5 4.5 -9 0 Z" fill="#fffaf1"/> <path d="M6 33 H60 V39 H6 Z" fill="#ef9fae" stroke-width="2"/> <path d="M24 9 q3 -6 7 -1 q4 -4 6 2 q-6 3 -13 -1 Z" fill="#fffaf1" stroke-width="2"/> <path d="M60 46 V24 a4 4 0 0 1 4 -4 H76 q5 0 7 5 L88 34 a4 4 0 0 1 1 2.6 V46 Z" fill="#e0655a"/> <path d="M65 23 H75 q3 0 4.5 3 L83 33 H65 Z" fill="#cfeaea" stroke-width="2"/> <path d="M3 46 H91" stroke-width="2.6"/> <rect x="85" y="38" width="5" height="4" rx="1.5" fill="#f7d38a" stroke-width="1.6"/> <path d="M67 20 q4 -5 10 0" fill="#f8ecd4" stroke-width="2"/> </g> <g class="trk-w trk-w1"><circle cx="21" cy="47" r="7.5" fill="#4a4242"/><circle cx="21" cy="47" r="3" fill="#f3e7d4" stroke-width="1.6"/><path d="M21 41 v3" stroke="#f3e7d4" stroke-width="1.6"/></g> <g class="trk-w trk-w2"><circle cx="73" cy="47" r="7.5" fill="#4a4242"/><circle cx="73" cy="47" r="3" fill="#f3e7d4" stroke-width="1.6"/><path d="M73 41 v3" stroke="#f3e7d4" stroke-width="1.6"/></g> </svg></div><div class="flag ic" data-icon="home"></div></div>
    <button id="foldBtn" class="ff fold hide"><span class="ic" data-icon="fold"></span><span>回店</span></button>
    <button id="ffBtn" class="ff fast" aria-label="加速"><span class="ic" data-icon="fast"></span></button>
  </div>

  <div id="toast" class="toast hide"></div>
  <div id="speech" class="speech hide"></div>
</div>

<!-- ======== LOADER ======== -->
<div id="loader">
  <div class="ld-in">
    <img class="ld-logo" src="./assets/logo-C2fly4fh.webp" alt="怪兽甜品铺" draggable="false" />
    <div class="ld-bar"><div id="ldFill"><div class="ld-head"><i class="puff p1"></i><i class="puff p2"></i><i class="puff p3"></i><i class="puff p4"></i><div class="ld-truck"><svg class="trk" viewBox="0 0 96 64" aria-hidden="true" stroke="#5b3a29" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"> <g class="trk-body"> <path d="M6 46 V20 a6 6 0 0 1 6 -6 H56 a4 4 0 0 1 4 4 V46 Z" fill="#fdeacb"/> <path d="M6 23 V20 a6 6 0 0 1 6 -6 H56 a4 4 0 0 1 4 4 V23 q-4.5 4.5 -9 0 q-4.5 4.5 -9 0 q-4.5 4.5 -9 0 q-4.5 4.5 -9 0 q-4.5 4.5 -9 0 q-4.5 4.5 -9 0 Z" fill="#fffaf1"/> <path d="M6 33 H60 V39 H6 Z" fill="#ef9fae" stroke-width="2"/> <path d="M24 9 q3 -6 7 -1 q4 -4 6 2 q-6 3 -13 -1 Z" fill="#fffaf1" stroke-width="2"/> <path d="M60 46 V24 a4 4 0 0 1 4 -4 H76 q5 0 7 5 L88 34 a4 4 0 0 1 1 2.6 V46 Z" fill="#e0655a"/> <path d="M65 23 H75 q3 0 4.5 3 L83 33 H65 Z" fill="#cfeaea" stroke-width="2"/> <path d="M3 46 H91" stroke-width="2.6"/> <rect x="85" y="38" width="5" height="4" rx="1.5" fill="#f7d38a" stroke-width="1.6"/> <path d="M67 20 q4 -5 10 0" fill="#f8ecd4" stroke-width="2"/> </g> <g class="trk-w trk-w1"><circle cx="21" cy="47" r="7.5" fill="#4a4242"/><circle cx="21" cy="47" r="3" fill="#f3e7d4" stroke-width="1.6"/><path d="M21 41 v3" stroke="#f3e7d4" stroke-width="1.6"/></g> <g class="trk-w trk-w2"><circle cx="73" cy="47" r="7.5" fill="#4a4242"/><circle cx="73" cy="47" r="3" fill="#f3e7d4" stroke-width="1.6"/><path d="M73 41 v3" stroke="#f3e7d4" stroke-width="1.6"/></g> </svg></div></div></div></div>
    <div class="ld-tip" id="ldTip"></div>
  </div>
</div>

</body>
</html>
