    --ink:#2a2018; --ink2:#5b4d40; --mute:#8a7b6b;
    --bg:#efe5d6; --paper:#fbf7ef; --porc:#f4f1ea;
    --mint:#8fd6c0; --mint-l:#dff3ea; --wood:#e3a982;
    --yellow:#f2b632; --yellow-l:#fbe3a3; --green:#5cc28a; --red:#e2553f; --navy:#4b5a78; --water:#58adec;
    --bw:2.5px; --lift:0 3px 0 var(--ink);
    --fun:"KL","PingFang SC","Noto Sans SC",sans-serif;
    --font:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg) radial-gradient(#d9ccb8 1.2px,transparent 1.3px) 0 0/18px 18px;padding:14px 14px 18px;display:flex;justify-content:center;height:100vh;height:100dvh}
  .wrap{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column}
  .card{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);padding:14px 16px 14px;flex:1;min-height:0;display:flex;flex-direction:column}

  .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .tag{font-family:var(--fun);font-size:13px;background:var(--mint);border:2px solid var(--ink);border-radius:99px;padding:2px 10px 1px;box-shadow:0 2px 0 var(--ink)}
  .ep{font-family:var(--fun);font-size:13px;color:var(--mute)}
  h1{margin:0;font-family:var(--fun);font-weight:400;font-size:25px;letter-spacing:.02em;line-height:1.2}
  .sub{margin:4px 0 10px;font-size:15px;color:var(--ink2);min-height:1.6em;display:flex;gap:8px;align-items:baseline}
  .sub::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--mint);transform:translateY(1px)}
  body[data-ph="1"] .sub::before{background:var(--yellow)} body[data-ph="2"] .sub::before,body[data-ph="3"] .sub::before{background:var(--water)}
  body[data-ph="6"] .sub::before{background:var(--green)} body[data-ph="4"] .sub::before,body[data-ph="5"] .sub::before{background:var(--red)}

  .stage{position:relative;flex:1;min-height:200px;border:var(--bw) solid var(--ink);border-radius:22px;overflow:hidden;touch-action:none;
    background:radial-gradient(120% 90% at 50% 38%,#ffffff 0%,#f3f7f1 45%,#e3efe8 100%)}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #gl:active{cursor:grabbing}
  .seg{position:absolute;left:10px;top:10px;z-index:2;display:flex;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:3px;box-shadow:0 2px 0 var(--ink)}
  .seg button{font-family:var(--fun);font-size:14px;border:0;background:transparent;color:var(--ink2);border-radius:99px;padding:5px 11px 4px;cursor:pointer;min-height:30px}
  .seg button.on{background:var(--ink);color:var(--paper)}
  .ico{position:absolute;right:10px;top:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);box-shadow:0 2px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
  .ico.on{background:var(--yellow-l)}
  .ico svg{width:20px;height:20px}
  .hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--ink2);background:#fbf7efcc;border-radius:99px;padding:3px 10px;pointer-events:none;display:flex;gap:5px;align-items:center}
  .hint svg{width:14px;height:14px}
  .lab{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--fun);font-size:13px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:1px 9px 0 5px;white-space:nowrap;box-shadow:0 2px 0 var(--ink);display:flex;align-items:center;gap:5px;line-height:20px}
  .lab i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
  #bub{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--fun);font-size:26px;letter-spacing:1px;transition:opacity .25s;opacity:0;
    text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 4px var(--ink),2px 4px var(--ink),-2px 4px var(--ink)}

  .ctl{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .b{font-family:var(--fun);font-size:18px;color:var(--ink);border:var(--bw) solid var(--ink);border-radius:18px;background:var(--c,var(--paper));box-shadow:0 4px 0 var(--ink);
     min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .08s,box-shadow .08s,background .2s;padding:0 12px}
  .b:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .b[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
  .b svg{width:24px;height:24px;flex:none}
  .b.y{--c:var(--yellow)} .b.g{--c:#9fe0bb} .b.g.on{--c:var(--green)}
  .tools{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tools .b{font-size:15px;min-height:44px;border-radius:14px;box-shadow:0 3px 0 var(--ink)}
  .tools .b:active{box-shadow:0 0 0 var(--ink)}
  .tools .b svg{width:19px;height:19px}
  .tools .b.on{--c:var(--mint-l)}
  .tools .b.why{--c:var(--yellow-l)}
  .tools .b.why.pulse{animation:pulse 1.2s ease-in-out 2}
  @keyframes pulse{50%{transform:translateY(-3px) rotate(-2deg)}}
  .mask{position:fixed;inset:0;background:#2a201866;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
  .mask.open{opacity:1;pointer-events:auto}
  .sheet{width:100%;max-width:480px;max-height:100%;overflow:auto;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:16px 16px 18px;transform:translateY(14px) scale(.98);transition:transform .22s}
  .mask.open .sheet{transform:none}
  .sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sh-h h2{margin:0;font-family:var(--fun);font-weight:400;font-size:22px}
  .x{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);box-shadow:0 2px 0 var(--ink);font-size:20px;line-height:1;cursor:pointer;color:var(--ink);display:grid;place-items:center;padding:0}
  .x:active{transform:translateY(2px);box-shadow:none}
  .sheet .steps{grid-template-columns:1fr;gap:10px;margin-bottom:12px}
  .sheet .step{display:flex;gap:12px;align-items:flex-start;padding:11px 13px}
  .sheet .num{flex:none;margin:0}

  .gauge{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--ink2)}
  .gauge .nm{font-family:var(--fun);font-size:15px;color:var(--ink)}
  .tube{position:relative;flex:1;height:16px;border:2px solid var(--ink);border-radius:99px;background:var(--porc);overflow:hidden}
  #fill{position:absolute;left:0;top:0;bottom:0;width:88%;background:linear-gradient(180deg,#8fcdf5,var(--water));border-right:2px solid #2c7cbc;transition:width .1s linear}
  .tube::after{content:"";position:absolute;left:88.2%;top:-2px;bottom:-2px;border-left:2px dashed var(--ink);opacity:.55}
  .val{font-family:var(--fun);font-size:15px;color:var(--ink);min-width:56px;text-align:right}
  .val b{font-weight:400;font-size:19px}
  #st{font-size:12.5px;background:var(--mint-l);border:1.5px solid var(--ink);border-radius:99px;padding:1px 8px;white-space:nowrap}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .step{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:13px 14px 14px;font-size:14.5px;line-height:1.65;color:var(--ink2);transition:background .25s,transform .25s}
  .step.on{background:#fff3cf;transform:translateY(-3px)}
  .num{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--c);color:var(--ink);display:grid;place-items:center;font-family:var(--fun);font-size:16px;margin-bottom:8px}
  .k{display:inline-block;width:.78em;height:.78em;border-radius:50%;border:1.5px solid var(--ink);vertical-align:-.04em;margin:0 .18em 0 .1em}
  .step b{color:var(--ink);font-weight:700}
  .idea{display:flex;gap:12px;align-items:center;background:var(--mint);border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:12px 16px;font-size:15.5px;line-height:1.55}
  .idea .t{flex:none;font-family:var(--fun);font-size:15px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:3px 9px 2px;transform:rotate(-4deg)}

  @media (max-width:560px){
    body{padding:8px 8px 12px}
    .card{padding:11px 11px 12px;border-radius:22px;box-shadow:0 4px 0 var(--ink)}
    .top{margin-bottom:3px} .tag,.ep{font-size:12px}
    h1{font-size:21px}
    .sub{font-size:13.5px;margin:3px 0 8px}
    .stage{border-radius:16px}
    .ctl{gap:8px;margin-top:10px}
    .gauge{margin-top:10px}
    .seg button{font-size:13px;padding:4px 9px 3px}
    .b{min-height:46px;font-size:17px}
    .tools .b{font-size:13px;gap:3px;padding:0 3px;min-height:40px;flex-direction:column;line-height:1}
    .tools .b{flex-direction:row}
    .tools .b svg{width:17px;height:17px}
  }
  #bSnd{right:58px} #bSnd .m{display:none} #bSnd:not(.on) .m{display:inline} #bSnd:not(.on) .w{display:none}

  html.rec body{padding:0;margin:0}
